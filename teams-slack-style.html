<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teams, Slack-style</title>
<style>
:root{
  color-scheme: light;
  --bg:#ffffff; --bg2:#f7f7fa; --hover:#f3f3f8; --text:#1c1b22; --muted:#6a6878; --line:#e3e2ea;
  --accent:#5b5fc7; --accent-ink:#ffffff; --danger:#b3261e;
  --notice:#fff4dd; --notice-text:#5c4300; --mention:#e6e7fb; --code:#f1f0f6;
  --rail:#1d1b3d; --nav:#2a2850; --nav-text:#e2e1f3; --nav-muted:#a3a1cc; --nav-hover:rgba(255,255,255,.09); --nav-active:rgba(255,255,255,.18);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#15141c; --bg2:#1b1a24; --hover:#201f2b; --text:#ebe9f3; --muted:#9c99ad; --line:#2b2937;
    --accent:#8b8ff0; --accent-ink:#14131c; --danger:#ff8a80;
    --notice:#3a2f12; --notice-text:#f3dca0; --mention:#2a2c57; --code:#23222e;
    --rail:#12112a; --nav:#1a1833;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#15141c; --bg2:#1b1a24; --hover:#201f2b; --text:#ebe9f3; --muted:#9c99ad; --line:#2b2937;
  --accent:#8b8ff0; --accent-ink:#14131c; --danger:#ff8a80;
  --notice:#3a2f12; --notice-text:#f3dca0; --mention:#2a2c57; --code:#23222e;
  --rail:#12112a; --nav:#1a1833;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--rail)}
body{height:100%;margin:0;background:var(--bg);color:var(--text);
  font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#app{height:100%;display:grid;grid-template-rows:48px minmax(0,1fr);position:relative}
#top{display:flex;align-items:center;gap:12px;padding:0 12px;background:var(--rail);color:var(--nav-text)}
#burger{display:none;background:none;border:0;color:var(--nav-text);font-size:20px;padding:6px 8px;border-radius:6px}
#searchWrap{flex:1;display:flex;justify-content:center}
#search{width:100%;max-width:560px;height:30px;border-radius:8px;border:1px solid rgba(255,255,255,.22);
  background:rgba(255,255,255,.12);color:#fff;padding:0 12px;font:inherit;font-size:14px}
#search::placeholder{color:rgba(255,255,255,.65)}
#search:focus{background:rgba(255,255,255,.2);outline:none;border-color:rgba(255,255,255,.55)}
#meChip{display:flex;align-items:center;gap:8px;font-size:13px;min-width:0}
#meChip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}

#body{display:grid;grid-template-columns:auto minmax(0,1fr) auto;min-height:0;position:relative}
#nav{display:flex;min-height:0}
#rail{width:64px;background:var(--rail);display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 0;overflow-y:auto;scrollbar-width:none}
#rail::-webkit-scrollbar{display:none}
.rbtn{width:42px;height:42px;border-radius:12px;border:2px solid transparent;display:grid;place-items:center;
  color:#fff;font-weight:700;font-size:14px;background:#3a3868;flex:none;padding:0;transition:border-radius .12s}
.rbtn:hover{border-radius:16px}
.rbtn[aria-current="true"]{border-color:#fff}
.rsep{width:30px;height:1px;background:rgba(255,255,255,.18);flex:none}
#col{width:252px;background:var(--nav);color:var(--nav-text);display:flex;flex-direction:column;min-height:0}
.colhead{padding:14px 16px 10px;font-weight:700;font-size:16px;border-bottom:1px solid rgba(255,255,255,.1);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.collist{flex:1;overflow-y:auto;padding:8px 8px 12px;min-height:0}
.collabel{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--nav-muted);padding:10px 8px 4px}
.item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;color:var(--nav-text);
  padding:5px 8px;border-radius:6px;min-height:30px}
.item:hover{background:var(--nav-hover)}
.item[aria-current="true"]{background:var(--nav-active);color:#fff;font-weight:600}
.item .hash{color:var(--nav-muted);width:14px;text-align:center;flex:none}
.item .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.colfilter{margin:8px 8px 0;height:30px;border-radius:6px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);
  color:#fff;padding:0 10px;font:inherit;font-size:13px;width:calc(100% - 16px)}
.colfilter::placeholder{color:rgba(255,255,255,.55)}
.colmsg{padding:10px 8px;color:var(--nav-muted);font-size:13px}
.linkbtn{background:none;border:0;color:var(--nav-text);text-decoration:underline;padding:4px 8px;font-size:13px}
.colfoot{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid rgba(255,255,255,.1);font-size:13px}
.colfoot .who{min-width:0}
.colfoot .who b,.colfoot .who small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.colfoot small{color:var(--nav-muted)}

.av{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;flex:none;user-select:none}
.av.sm{width:22px;height:22px;font-size:10px;border-radius:6px}

#main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
#mhead{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);min-height:52px}
#mhead .title{font-weight:700;font-size:16px;white-space:nowrap}
#mhead .desc{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
#mhead .spacer{flex:1}
#mhead .status{color:var(--muted);font-size:12px;white-space:nowrap}
.ibtn{background:none;border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:13px;color:var(--text);text-decoration:none;white-space:nowrap}
.ibtn:hover{background:var(--hover)}
#notice{margin:10px 16px 0;padding:8px 12px;border-radius:8px;background:var(--notice);color:var(--notice-text);font-size:13px;display:flex;gap:12px;align-items:center}
#notice .grow{flex:1}
#notice button{background:none;border:1px solid currentColor;border-radius:6px;padding:2px 10px;font-size:13px}
#stage{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
#msgs{flex:1;overflow-y:auto;padding:8px 0 12px;min-height:0}
.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--muted);padding:24px}
.empty h2{color:var(--text);margin:0 0 6px;font-size:18px}
.older{display:block;margin:8px auto 4px;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:4px 14px;font-size:13px}
.day{display:flex;align-items:center;gap:12px;margin:14px 16px 6px;color:var(--muted);font-size:12px;font-weight:600}
.day::before,.day::after{content:"";flex:1;height:1px;background:var(--line)}
.msg{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;padding:4px 16px;position:relative}
.msg:hover{background:var(--hover)}
.msg.compact{padding-top:1px;padding-bottom:1px}
.gutter{font-size:11px;color:transparent;text-align:right;padding-top:3px;user-select:none}
.msg.compact:hover .gutter{color:var(--muted)}
.mhead{display:flex;align-items:baseline;gap:8px}
.mname{font-weight:700}
.mtime{color:var(--muted);font-size:12px}
.pending{color:var(--muted);font-size:12px;font-style:italic}
.subject{font-weight:600;margin-top:2px}
.mbody{overflow-wrap:anywhere}
.mbody.plain{white-space:pre-wrap}
.mbody p{margin:0 0 .5em}
.mbody p:last-child{margin-bottom:0}
.mbody ul,.mbody ol{margin:.3em 0;padding-left:1.4em}
.mbody blockquote{margin:.4em 0;padding-left:10px;border-left:3px solid var(--line);color:var(--muted)}
.mbody pre,.mbody code{background:var(--code);border-radius:4px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.mbody pre{padding:8px;overflow-x:auto}
.mbody table{border-collapse:collapse;display:block;overflow-x:auto;max-width:100%}
.mbody td,.mbody th{border:1px solid var(--line);padding:3px 8px;vertical-align:top}
.mbody .mention{background:var(--mention);border-radius:4px;padding:0 3px;font-weight:600}
.mbody.clamped{max-height:230px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 72%,transparent);mask-image:linear-gradient(#000 72%,transparent)}
.more{background:none;border:0;color:var(--accent);padding:2px 0;font-size:13px}
.atts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.att{border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:13px;text-decoration:none;background:var(--bg2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trunc{font-size:12px;color:var(--muted);margin-top:4px}
.acts{position:absolute;right:16px;top:-12px;display:none;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px}
.msg:hover .acts,.msg:focus-within .acts{display:flex}
.acts button,.acts a{background:none;border:0;border-radius:6px;padding:3px 8px;font-size:12px;color:var(--text);text-decoration:none}
.acts button:hover,.acts a:hover{background:var(--hover)}
@media (hover:none){.acts{display:flex;position:static;border:0;padding:0;margin-top:4px;background:none}}
.sysnote{padding:4px 16px;color:var(--muted);font-size:12px}

.composer{margin:0 16px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.composer:focus-within{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.composer textarea{display:block;width:100%;border:0;outline:0;resize:none;background:transparent;color:var(--text);font:inherit;padding:10px 12px 4px;max-height:160px}
.composer .bar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 8px 8px 12px}
.composer .hint{color:var(--muted);font-size:12px}
.composer .send{background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:5px 14px;font-weight:600}
.composer .send:disabled{opacity:.5;cursor:default}
.cerr{padding:2px 12px;color:var(--danger);font-size:13px}

#searchPanel{position:absolute;inset:0;background:var(--bg);overflow-y:auto;padding:12px 16px}
#searchPanel h3{margin:0 0 10px;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.hit{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 4px;color:var(--text)}
.hit:hover{background:var(--hover)}
.hit .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.hit .meta b{color:var(--text)}
.hit .snip{margin-top:2px;overflow-wrap:anywhere}

.newbtn{display:flex;align-items:center;gap:8px;width:calc(100% - 16px);margin:8px 8px 0;padding:6px 10px;border-radius:6px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.1);color:#fff;font-weight:600;font-size:13px}
.newbtn:hover{background:rgba(255,255,255,.18)}
.pfield{width:100%;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);padding:0 12px;font:inherit;margin-bottom:8px}
.person{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 4px;color:var(--text)}
.person:hover{background:var(--hover)}
.person small{display:block;color:var(--muted)}
.person:disabled{opacity:.5;cursor:default}
#newpill{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:6px 14px;font-weight:600;font-size:13px;box-shadow:0 2px 10px rgba(0,0,0,.3);z-index:5}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2e9e5b;margin-right:6px}
.live.off{background:var(--muted)}
.reacts{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.react{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);background:var(--bg2);border-radius:999px;padding:1px 8px;font-size:13px;cursor:default}
.react.mine{border-color:var(--accent);background:var(--mention)}
#thread{width:380px;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--bg)}
#thread .thead{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line);font-weight:700;min-height:52px}
#thread .tlist{flex:1;overflow-y:auto;padding:8px 0;min-height:0}
#thread .tdiv{margin:6px 16px;color:var(--muted);font-size:12px;display:flex;align-items:center;gap:8px}
#thread .tdiv::after{content:"";flex:1;height:1px;background:var(--line)}

#gate{position:absolute;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}
.gatecard{max-width:430px;text-align:center}
.gatecard h1{font-size:22px;margin:12px 0 8px}
.gatecard p{color:var(--muted);margin:0 0 16px}
.gatecard .big{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:9px 20px;font-weight:700;font-size:15px}
.gatecard .logo{width:56px;height:56px;border-radius:14px;margin:0 auto;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:26px}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp .8s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}

#backdrop{display:none}
@media (max-width:820px){
  #body{grid-template-columns:minmax(0,1fr)}
  #burger{display:block}
  #meChip span{display:none}
  #nav{position:absolute;top:0;bottom:0;left:0;z-index:30;transform:translateX(-102%);transition:transform .18s;box-shadow:4px 0 18px rgba(0,0,0,.35)}
  #app.nav-open #nav{transform:none}
  #app.nav-open #backdrop{display:block;position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:20}
  #col{width:min(252px,64vw)}
  #thread{position:absolute;inset:0;width:100%;z-index:25;border-left:0}
  #mhead .desc{display:none}
}
@media (prefers-reduced-motion:reduce){#nav{transition:none}}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <button id="burger" type="button" aria-label="Open navigation">☰</button>
    <div id="searchWrap"><input id="search" type="search" placeholder="Search Teams messages" autocomplete="off" aria-label="Search Teams messages"></div>
    <div id="meChip"></div>
  </header>
  <div id="body">
    <div id="backdrop"></div>
    <nav id="nav" aria-label="Teams navigation"><div id="rail"></div><div id="col"></div></nav>
    <main id="main">
      <div id="mhead"></div>
      <div id="notice" hidden></div>
      <div id="stage"><div id="msgs"></div><div id="searchPanel" hidden></div><button id="newpill" type="button" hidden></button></div>
      <div id="composerWrap"></div>
    </main>
    <aside id="thread" hidden aria-label="Thread"></aside>
  </div>
  <div id="gate"></div>
</div>

<script>
"use strict";
(function () {
  var SERVER = "Microsoft 365";
  var S = { mcp: null, me: null, mail: "", teams: [], channels: {}, chats: [], chatsCursor: null,
            chatFilter: "", mode: "chats", teamId: null, thread: null, search: null };
  var V = null; // current main view (channel or chat)
  var DENIAL = { needs_reauth: 1, server_not_connected: 1, blocked_by_policy: 1, approval_required: 1,
                 not_in_manifest: 1, consent_required: 1, selection_required: 1 };

  /* ---------- small helpers ---------- */
  function $(s, r) { return (r || document).querySelector(s); }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function h(tag, props) {
    var el = document.createElement(tag);
    if (props) Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (v == null || v === false) return;
      if (k === "class") el.className = v;
      else if (k === "style") el.style.cssText = v;
      else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    });
    for (var i = 2; i < arguments.length; i++) addKids(el, arguments[i]);
    return el;
  }
  function addKids(el, kid) {
    if (kid == null || kid === false) return;
    if (Array.isArray(kid)) { kid.forEach(function (k) { addKids(el, k); }); return; }
    el.appendChild(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  function hue(s) { var x = 0; for (var i = 0; i < s.length; i++) x = (x * 31 + s.charCodeAt(i)) >>> 0; return x % 360; }
  function initials(name) {
    var parts = String(name || "?").replace(/\(.*?\)/g, "").trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return "?";
    return ((parts[0][0] || "") + (parts.length > 1 ? parts[parts.length - 1][0] : "")).toUpperCase();
  }
  function avatar(name, small) {
    return h("div", { class: "av" + (small ? " sm" : ""), style: "background:hsl(" + hue(name || "?") + " 42% 40%)", "aria-hidden": "true" }, initials(name));
  }
  function fmtTime(d) { return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); }
  function dayLabel(d) {
    var t = new Date(), y = new Date(t); y.setDate(t.getDate() - 1);
    if (d.toDateString() === t.toDateString()) return "Today";
    if (d.toDateString() === y.toDateString()) return "Yesterday";
    var o = { weekday: "long", day: "numeric", month: "long" };
    if (d.getFullYear() !== t.getFullYear()) o.year = "numeric";
    return d.toLocaleDateString([], o);
  }

  /* ---------- result parsing (connector results can be several JSON blocks) ---------- */
  function splitJson(text) {
    var out = [], depth = 0, start = -1, inStr = false, esc = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (inStr) { if (esc) esc = false; else if (c === "\\") esc = true; else if (c === '"') inStr = false; continue; }
      if (c === '"') { if (depth > 0) inStr = true; continue; }
      if (c === "{" || c === "[") { if (depth === 0) start = i; depth++; }
      else if (c === "}" || c === "]") { if (depth > 0) { depth--; if (depth === 0 && start >= 0) { out.push(text.slice(start, i + 1)); start = -1; } } }
    }
    return out;
  }
  function parseResult(r) {
    var rows = [];
    var blocks = (r && r.content) || [];
    blocks.forEach(function (b) {
      if (!b || b.type !== "text" || !b.text) return;
      splitJson(b.text).forEach(function (p) {
        try { var v = JSON.parse(p); if (Array.isArray(v)) rows.push.apply(rows, v); else rows.push(v); } catch (e) {}
      });
    });

      var s = r.structuredContent;
      if (Array.isArray(s)) rows.push.apply(rows, s);
      else if (s && typeof s === "object") {
        var arr = s.result || s.items || s.value || s.teams || s.chats || s.messages;
        if (Array.isArray(arr)) rows.push.apply(rows, arr); else rows.push(s);
      }
    }
    return rows;
  }
  function splitPage(rows) {
    var meta = null, out = [];
    rows.forEach(function (r) {
      if (r && typeof r === "object" && !r.id && ("moreResults" in r || "nextCursor" in r || "nextOffset" in r)) meta = r; else out.push(r);
    });
    return { rows: out, meta: meta };
  }

  /* ---------- body sanitiser (message HTML comes from other people) ---------- */
  var ALLOWED = {}; "A B STRONG I EM U S STRIKE P BR DIV SPAN UL OL LI BLOCKQUOTE PRE CODE TABLE THEAD TBODY TR TD TH H1 H2 H3 H4 H5 H6 HR AT".split(" ").forEach(function (t) { ALLOWED[t] = 1; });
  var DROP = {}; "SCRIPT STYLE IFRAME OBJECT EMBED LINK META IMG SVG FORM INPUT BUTTON TEXTAREA SELECT NOSCRIPT TITLE HEAD ATTACHMENT VIDEO AUDIO".split(" ").forEach(function (t) { DROP[t] = 1; });
  function sanitize(html) {
    var doc = new DOMParser().parseFromString(html || "", "text/html");
    var frag = document.createDocumentFragment();
    (function walk(src, dst) {
      Array.prototype.slice.call(src.childNodes).forEach(function (n) {
        if (n.nodeType === 3) { dst.appendChild(document.createTextNode(n.nodeValue)); return; }
        if (n.nodeType !== 1) return;
        var tag = n.tagName.toUpperCase();
        if (DROP[tag]) return;
        if (ALLOWED[tag]) {
          var el;
          if (tag === "AT") { el = document.createElement("span"); el.className = "mention"; }
          else el = document.createElement(tag.toLowerCase());
          if (tag === "A") {
            var href = n.getAttribute("href") || "";

    var txt = ((res && res.content) || []).map(function (b) { return b && b.text || ""; }).join(" ");
    var m = /19:[^\s"',]+@(?:unq\.gbl\.spaces|thread\.v2)/.exec(txt);
    return m ? m[0] : null;
  }
  async function startChatWith(s, person) {
    if (s.starting) return;
    s.starting = true; s.startError = null; renderPeople();
    var upn = person.userPrincipalName, email = String(person.mail || upn).toLowerCase();
    try {
      var chat = S.chats.find(function (c) {
        return c.chatType === "oneOnOne" && (c.members || []).length === 2 && c.members.some(function (m) { return String(m.email || "").toLowerCase() === email; });
      });
      if (!chat) {
        var id = chatIdFrom(await S.mcp.callTool(SERVER, "teams_create_chat", { members: [upn], chatType: "oneOnOne" }));
        if (!id) throw { code: "upstream_error", message: "Teams didn’t return a chat id." };
        chat = S.chats.find(function (c) { return c.id === id; });
        if (!chat) {
          chat = { id: id, chatType: "oneOnOne", topic: null, memberCount: 2, members: [{ displayName: S.me.displayName, email: S.mail }, { displayName: person.displayName, email: email }] };
          S.chats.unshift(chat);
        }
      }
      openChat(chat);
    } catch (e) {
      s.starting = false; s.startError = explain(e);
      if (S.people === s) renderPeople();
    }
  }

  /* ---------- wiring ---------- */
  $("#burger").addEventListener("click", function () { $("#app").classList.toggle("nav-open"); });
  $("#newpill").addEventListener("click", function () { var b = $("#msgs"); b.scrollTop = b.scrollHeight; if (V) V.unseen = 0; this.hidden = true; });
  $("#msgs").addEventListener("scroll", function () { if (V && V.unseen && this.scrollHeight - this.scrollTop - this.clientHeight < 140) { V.unseen = 0; $("#newpill").hidden = true; } });
  document.addEventListener("visibilitychange", function () { if (!document.hidden && V && V.kick) V.kick(); });
  $("#backdrop").addEventListener("click", closeNav);
  $("#search").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.isComposing) { var q = this.value.trim(); if (q && S.mcp && S.me) runSearch(q, false); }
    else if (e.key === "Escape") { this.value = ""; closeSearch(); }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { if (S.search || S.people) closeSearch(); else if (S.thread) closeThread(); }
  });
  boot();
})();
</script>
